[versions]
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "24"
androidx-collection = "1.4.5"
androidx-lifecycle = "2.11.0-beta02"
composeMultiplatform = "1.11.1"
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
material3 = "1.11.0-alpha07"
material3Adaptive = "1.3.0-beta02"
materialIconsExtended = "1.7.3"
okio = "3.18.1"
# Tree-sitter 运行时（官方 Kotlin 绑定，JVM/Android/Native）与各语法包版本。
# 语法包版本按 grammar 各自演进，未跟进 0.25.1 的语言用其自己的最新版。
ktreesitter = "0.25.1"
treesitterJava = "0.25.1"
treesitterKotlin = "0.3.8"
treesitterXml = "0.7.0"
treesitterToml = "0.7.0"
treesitterYaml = "0.7.2"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidx-collection" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
compose-materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
ktreesitter = { module = "io.github.tree-sitter:ktreesitter", version.ref = "ktreesitter" }
treesitter-languages-java = { module = "cn.enaium.treesitter:treesitter-languages-java-kmp", version.ref = "treesitterJava" }
treesitter-languages-kotlin = { module = "cn.enaium.treesitter:treesitter-languages-kotlin-kmp", version.ref = "treesitterKotlin" }
treesitter-languages-xml = { module = "cn.enaium.treesitter:treesitter-languages-xml-kmp", version.ref = "treesitterXml" }
treesitter-languages-toml = { module = "cn.enaium.treesitter:treesitter-languages-toml-kmp", version.ref = "treesitterToml" }
treesitter-languages-yaml = { module = "cn.enaium.treesitter:treesitter-languages-yaml-kmp", version.ref = "treesitterYaml" }
# 其余语法包与运行时同版本（0.25.1）
treesitter-languages-json = { module = "cn.enaium.treesitter:treesitter-languages-json-kmp", version.ref = "ktreesitter" }
treesitter-languages-python = { module = "cn.enaium.treesitter:treesitter-languages-python-kmp", version.ref = "ktreesitter" }
treesitter-languages-javascript = { module = "cn.enaium.treesitter:treesitter-languages-javascript-kmp", version.ref = "ktreesitter" }
treesitter-languages-typescript = { module = "cn.enaium.treesitter:treesitter-languages-typescript-kmp", version.ref = "ktreesitter" }
treesitter-languages-html = { module = "cn.enaium.treesitter:treesitter-languages-html-kmp", version.ref = "ktreesitter" }
treesitter-languages-css = { module = "cn.enaium.treesitter:treesitter-languages-css-kmp", version.ref = "ktreesitter" }
treesitter-languages-c = { module = "cn.enaium.treesitter:treesitter-languages-c-kmp", version.ref = "ktreesitter" }
treesitter-languages-cpp = { module = "cn.enaium.treesitter:treesitter-languages-cpp-kmp", version.ref = "ktreesitter" }
treesitter-languages-go = { module = "cn.enaium.treesitter:treesitter-languages-go-kmp", version.ref = "ktreesitter" }
treesitter-languages-rust = { module = "cn.enaium.treesitter:treesitter-languages-rust-kmp", version.ref = "ktreesitter" }
treesitter-languages-bash = { module = "cn.enaium.treesitter:treesitter-languages-bash-kmp", version.ref = "ktreesitter" }

[plugins]
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
